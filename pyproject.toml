[project]
name = "attention-leverage"
version = "0.1.0"
description = "Goal-driven information aggregation that expands machine search while shrinking human attention load."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
