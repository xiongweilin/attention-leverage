[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-leverage"
version = "0.4.0"
description = "Goal-driven heterogeneous information aggregation with persistent cognitive calibration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=6,<8"]

[project.scripts]
attention-leverage = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "tests*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
