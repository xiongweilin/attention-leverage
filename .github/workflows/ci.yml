name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q app
      - run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Set Sonar project version from pyproject
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          python -c 'import tomllib; from pathlib import Path; project=tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8")); config=Path("sonar-project.properties"); config.write_text(config.read_text(encoding="utf-8") + "\nsonar.projectVersion=" + project["project"]["version"] + "\n", encoding="utf-8")'
      - name: SonarQube Cloud scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
