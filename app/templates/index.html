<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attention Leverage</title>
<style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}main{max-width:1180px;margin:auto;padding:34px 20px 80px}h1{margin:0 0 4px;font-size:30px}.muted,.meta{opacity:.62}.meta{font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 14px}.tabs button,button{border:1px solid color-mix(in srgb,CanvasText 18%,transparent);background:Canvas;color:CanvasText;border-radius:9px;padding:8px 12px;cursor:pointer}.tabs button.active{font-weight:700;border-color:CanvasText}textarea,input{width:100%;background:Canvas;color:CanvasText;border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:11px;padding:12px;font:inherit}textarea{min-height:110px}form button{margin-top:9px;font-weight:700}.digest,.panel{margin:22px 0;padding:17px;border-left:3px solid CanvasText;background:color-mix(in srgb,CanvasText 4%,Canvas)}.columns{display:grid;grid-template-columns:2fr 1fr;gap:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:820px){.columns,.grid{grid-template-columns:1fr}}.card{padding:15px 0;border-top:1px solid color-mix(in srgb,CanvasText 14%,transparent)}.mini{padding:12px;border:1px solid color-mix(in srgb,CanvasText 14%,transparent);border-radius:10px}.card h3,.mini h3{margin:7px 0;font-size:16px}.card a{color:inherit;text-underline-offset:3px}.pill{display:inline-block;font-size:11px;padding:2px 7px;border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:999px;margin-right:5px}.feedback{float:right}.feedback button{font-size:11px;padding:3px 7px;margin-left:4px}.section{margin-top:24px}.hidden{display:none}.source,.coverage{display:grid;grid-template-columns:150px 130px 1fr 110px;gap:8px;padding:8px 0;border-top:1px solid color-mix(in srgb,CanvasText 10%,transparent);font-size:13px}@media(max-width:700px){.source,.coverage{grid-template-columns:1fr}}.history-row{padding:10px 0;border-top:1px solid color-mix(in srgb,CanvasText 12%,transparent);cursor:pointer}ul{padding-left:20px}pre{white-space:pre-wrap;font-size:12px}.wide-form{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end}.wide-form button{margin:0}@media(max-width:700px){.wide-form{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>Attention Leverage</h1><div class="muted">扩大机器观察面，缩小人的注意面；同时持续检查自己长期没看到什么。</div>
<div class="tabs"><button data-tab="run" class="active">运行</button><button data-tab="cognitive">认知地图</button><button data-tab="history">历史</button><button data-tab="sources">信息源</button></div>
<section id="tab-run">
<form id="form"><label for="input">今天真正需要知道什么？</label><textarea id="input" placeholder="可以是一个决策、风险、机会、陌生环境，或需要持续检验的判断。"></textarea><button>理解目标并搜索</button></form>
<div id="status" class="meta" style="margin-top:12px"></div><div id="result"></div>
</section>
<section id="tab-cognitive" class="hidden">
<h2>长期认知地图</h2><div class="muted">这里记录搜索覆盖、显式工作假设、反证和陌生环境，而不是兴趣画像。</div>
<div id="cognitive"></div>
<h2>工作假设</h2>
<form id="assumption-form" class="wide-form">
<div><label for="assumption">一个可被证伪的判断</label><input id="assumption" placeholder="例如：某行业的主要进入门槛仍然是正式学历"></div>
<div><label for="assumption-scope">范围</label><input id="assumption-scope" placeholder="例如：AI 基础设施招聘"></div>
<button>保存假设</button>
</form><div id="assumptions"></div>
</section>
<section id="tab-history" class="hidden"><h2>历史运行</h2><div id="history"></div></section>
<section id="tab-sources" class="hidden"><h2>源池</h2><div class="muted">模型按目标动态选择不同信息生成机制；这里显示当前可用源和运行健康。</div><div id="sources"></div></section>
</main>
<script>
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');['run','cognitive','history','sources'].forEach(function(s){$('#tab-'+s).classList.toggle('hidden',s!==b.dataset.tab)});if(b.dataset.tab==='history')loadHistory();if(b.dataset.tab==='sources')loadSources();if(b.dataset.tab==='cognitive')loadCognitive()}});
function list(title,arr){if(!arr||!arr.length)return '';return '<h4>'+esc(title)+'</h4><ul>'+arr.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}
function itemCard(x){return '<article class="card"><div><span class="pill">'+esc(x.disposition)+'</span><span class="pill">'+esc(x.source)+'</span><span class="pill">'+esc(x.source_category)+'</span><span class="meta">score '+Math.round(x.score*100)+' · model pressure '+Math.round((x.model_pressure||0)*100)+' · seen '+x.seen_count+'</span><span class="feedback"><button class="fb" data-id="'+esc(x.id)+'" data-source="'+esc(x.source)+'" data-useful="1">有用</button><button class="fb" data-id="'+esc(x.id)+'" data-source="'+esc(x.source)+'" data-useful="0">无关</button></span></div><h3><a target="_blank" rel="noreferrer" href="'+esc(x.url)+'">'+esc(x.title)+'</a></h3><div>'+esc(x.reason)+'</div>'+(x.signal?'<div class="meta">signal: '+esc(x.signal)+'</div>':'')+'<div class="meta">'+(x.published_at?new Date(x.published_at).toLocaleString():'时间未知')+' · authority '+esc(x.authority)+'</div></article>'}
function blindCard(x){return '<div class="mini"><span class="pill">'+Math.round((x.severity||0)*100)+'</span><h3>'+esc(x.area)+'</h3><div>'+esc(x.why_unseen)+'</div><div class="meta">'+esc(x.evidence_gap)+'</div>'+(x.suggested_probe?'<p><b>下一探针：</b>'+esc(x.suggested_probe)+'</p>':'')+'</div>'}
function envCard(x){return '<div class="mini"><span class="pill">distance '+Math.round((x.distance||0)*100)+'</span><h3>'+esc(x.name)+'</h3><div>'+esc(x.why_distant||x.description)+'</div>'+list('真实入口',x.entry_points)+list('默认规则',x.hidden_rules)+list('连接者',x.connectors)+list('常见路径',x.paths)+list('时间窗口',x.timing)+list('低成本入口',x.low_cost_entries)+'</div>'}
function reinterpretCard(x){return '<div class="mini"><h3>'+esc(x.trigger)+'</h3><div><b>旧解释：</b>'+esc(x.old_frame)+'</div><div><b>新解释：</b>'+esc(x.new_frame)+'</div><div class="meta">confidence '+Math.round((x.confidence||0)*100)+'</div></div>'}
function challengeCard(x){return '<div class="mini"><span class="pill">'+esc(x.strength)+'</span><span class="pill">'+Math.round((x.severity||0)*100)+'</span><h3>'+esc(x.assumption)+'</h3><div><b>反信号：</b>'+esc(x.signal)+'</div><div class="meta">'+esc(x.why_it_matters)+'</div></div>'}
function cognitiveBlock(cm){cm=cm||{};return '<section class="section"><h2>你长期没看到什么？</h2><div class="grid">'+((cm.long_unseen||[]).map(blindCard).join('')||'<div class="muted">目前没有足够证据指出具体长期盲区。</div>')+'</div><h2>哪些环境与你的认知距离最大？</h2><div class="grid">'+((cm.distant_environments||[]).map(envCard).join('')||'<div class="muted">尚未形成稳定的陌生环境判断。</div>')+'</div><h2>哪些变化可能让你重新解释现在？</h2><div class="grid">'+((cm.reinterpretations||[]).map(reinterpretCard).join('')||'<div class="muted">当前没有足够强的重解释触发器。</div>')+'</div><h2>哪些信号说明既有模型正在失效？</h2><div class="grid">'+((cm.model_failures||[]).map(challengeCard).join('')||'<div class="muted">当前没有足够反证支持“模型正在失效”。</div>')+'</div>'+list('下一轮最值得探索',cm.next_explorations)+'</section>'}
function bindFeedback(){document.querySelectorAll('.fb').forEach(function(b){b.onclick=function(){fb(b.dataset.id,b.dataset.source,b.dataset.useful==='1')}})}
function render(data){var d=data.digest||{},groups={attention:[],watch:[],background:[]};data.items.forEach(function(x){groups[x.disposition].push(x)});$('#status').textContent='采集 '+data.raw_count+' → 程序过滤 '+data.filtered_count+' → 输出 '+data.items.length+' · 规划模型 '+(data.model_used_for_planning?'on':'fallback')+' · 筛选模型 '+(data.model_used_for_screening?'on':'fallback');$('#result').innerHTML='<div class="digest"><h2>'+esc(d.headline||data.plan.goal)+'</h2>'+list('真正变化',d.what_changed)+list('可能行动',d.possible_actions)+list('仍未知',d.unresolved)+'</div>'+cognitiveBlock(data.cognitive_map)+'<div class="columns"><div><section class="section"><h2>需要注意</h2>'+(groups.attention.map(itemCard).join('')||'<div class="muted">无</div>')+'</section><section class="section"><h2>继续观察</h2>'+(groups.watch.map(itemCard).join('')||'<div class="muted">无</div>')+'</section></div><aside><h3>查询计划</h3><div class="meta">'+esc(data.plan.goal)+'</div>'+list('关键信号',data.plan.desired_signals)+list('工作假设',data.plan.working_assumptions)+list('探索问题',data.plan.exploration_questions)+list('未知项',data.plan.uncertainties)+'<details><summary>背景项 ('+groups.background.length+')</summary>'+groups.background.map(itemCard).join('')+'</details>'+(Object.keys(data.source_errors||{}).length?'<details><summary>源错误</summary><pre>'+esc(JSON.stringify(data.source_errors,null,2))+'</pre></details>':'')+'</aside></div>';bindFeedback()}
$('#form').onsubmit=async function(e){e.preventDefault();var input=$('#input').value.trim();if(!input)return;$('#status').textContent='理解目标 → 调用长期认知上下文 → 动态选源 → 并发查询 → 程序压缩 → 语义筛选 → 认知校准…';$('#result').innerHTML='';try{var r=await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input:input})});if(!r.ok)throw new Error(await r.text());render(await r.json())}catch(err){$('#status').textContent='失败';$('#result').innerHTML='<pre>'+esc(err)+'</pre>'}}
async function fb(id,source,useful){await fetch('/api/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({item_id:id,source:source,useful:useful,note:''})})}
async function loadHistory(){var d=await (await fetch('/api/history')).json();$('#history').innerHTML=d.runs.map(function(x){return '<div class="history-row" data-run="'+esc(x.run_id)+'"><b>'+esc(x.headline||x.goal)+'</b><div class="meta">'+new Date(x.created_at).toLocaleString()+' · '+x.raw_count+'→'+x.filtered_count+' · '+x.items+' output · '+(x.model_challenges||0)+' model challenges · '+(x.distant_environments||0)+' distant environments</div></div>'}).join('')||'<div class="muted">暂无</div>';document.querySelectorAll('.history-row').forEach(function(x){x.onclick=function(){openRun(x.dataset.run)}})}
async function openRun(id){var d=await (await fetch('/api/history/'+id)).json();document.querySelector('[data-tab=run]').click();render(d)}
async function loadSources(){var d=await (await fetch('/api/sources')).json();$('#sources').innerHTML=d.sources.map(function(x){return '<div class="source"><b>'+esc(x.name)+'</b><span>'+esc(x.category)+'</span><span>'+esc(x.description)+'</span><span>'+esc(x.authority)+(x.health?' · '+x.health.successes+'/'+x.health.failures:'')+'</span></div>'}).join('')}
async function loadCognitive(){var d=await (await fetch('/api/cognitive-map')).json();$('#cognitive').innerHTML='<div class="panel"><h3>低覆盖环境</h3>'+((d.underexplored_categories||[]).map(function(x){return '<div class="coverage"><b>'+esc(x.category)+'</b><span>searches '+x.searches+'</span><span>'+esc(x.reason)+'</span><span>items '+x.items+'</span></div>'}).join('')||'<div class="muted">暂无明显低覆盖类别。</div>')+'</div><h3>长期出现的陌生环境</h3><div class="grid">'+((d.environments||[]).slice(0,12).map(envCard).join('')||'<div class="muted">暂无</div>')+'</div><h3>近期模型挑战</h3><div class="grid">'+((d.recent_model_challenges||[]).map(challengeCard).join('')||'<div class="muted">暂无</div>')+'</div>';renderAssumptions(d.assumptions||[])}
function renderAssumptions(arr){$('#assumptions').innerHTML=arr.map(function(x){return '<div class="card"><span class="pill">'+esc(x.status)+'</span><b>'+esc(x.statement)+'</b><div class="meta">'+esc(x.scope)+' · confidence '+Math.round((x.confidence||0)*100)+(x.last_challenged_at?' · challenged '+new Date(x.last_challenged_at).toLocaleString():'')+'</div><button class="del-assumption" data-id="'+esc(x.id)+'">删除</button></div>'}).join('')||'<div class="muted">尚未保存显式工作假设。</div>';document.querySelectorAll('.del-assumption').forEach(function(b){b.onclick=function(){deleteAssumption(b.dataset.id)}})}
$('#assumption-form').onsubmit=async function(e){e.preventDefault();var statement=$('#assumption').value.trim();if(!statement)return;await fetch('/api/assumptions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({statement:statement,scope:$('#assumption-scope').value.trim(),confidence:.6})});$('#assumption').value='';loadCognitive()}
async function deleteAssumption(id){await fetch('/api/assumptions/'+id,{method:'DELETE'});loadCognitive()}
</script></body></html>
