<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attention Leverage</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 28px; margin-bottom: 6px; }
    .muted { opacity: .62; }
    textarea { width: 100%; min-height: 112px; box-sizing: border-box; padding: 14px; font: inherit; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; background: Canvas; color: CanvasText; }
    button { margin-top: 10px; padding: 10px 16px; font: inherit; font-weight: 650; border: 0; border-radius: 10px; cursor: pointer; }
    .status { margin: 18px 0; font-size: 14px; }
    .plan { border-left: 3px solid currentColor; padding-left: 14px; margin: 22px 0; }
    .group { margin-top: 28px; }
    .card { padding: 16px 0; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    .card a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .meta { font-size: 12px; opacity: .58; margin: 6px 0; }
    .reason { margin: 6px 0 0; }
    .score { font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 2px 7px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 999px; margin-right: 6px; font-size: 11px; }
    pre { white-space: pre-wrap; font-size: 12px; opacity: .75; }
  </style>
</head>
<body>
<main>
  <h1>Attention Leverage</h1>
  <div class="muted">扩大机器的观察面，缩小人的注意面。</div>
  <form id="form">
    <textarea id="input" placeholder="今天你真正想知道什么？例如：过去 48 小时里，哪些 AI agent 基础设施变化可能影响我未来 6 个月的开发方向？"></textarea>
    <button type="submit">运行</button>
  </form>
  <div id="status" class="status muted"></div>
  <section id="result"></section>
</main>
<script>
const form = document.querySelector('#form');
const input = document.querySelector('#input');
const statusEl = document.querySelector('#status');
const resultEl = document.querySelector('#result');

function esc(s='') { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function card(x) {
  const published = x.published_at ? new Date(x.published_at).toLocaleString() : 'time unknown';
  return `<article class="card">
    <div><span class="pill">${esc(x.source)}</span><span class="score">${Math.round(x.score*100)}</span></div>
    <h3><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.title)}</a></h3>
    <div class="meta">${esc(published)} · query: ${esc(x.query)}</div>
    <div class="reason">${esc(x.reason)}</div>
    ${x.signal ? `<div class="meta">signal: ${esc(x.signal)}</div>` : ''}
  </article>`;
}
function group(title, items) {
  if (!items.length) return '';
  return `<section class="group"><h2>${title}</h2>${items.map(card).join('')}</section>`;
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const value = input.value.trim(); if (!value) return;
  resultEl.innerHTML = ''; statusEl.textContent = '正在理解目标、查询异质信息源并压缩候选…';
  try {
    const r = await fetch('/api/run', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({input:value})});
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    statusEl.textContent = `采集 ${data.raw_count} 条 → 程序过滤 ${data.filtered_count} 条 → 输出 ${data.items.length} 条 · 规划模型 ${data.model_used_for_planning ? 'on':'fallback'} · 筛选模型 ${data.model_used_for_screening ? 'on':'fallback'}`;
    const p = data.plan;
    const plan = `<div class="plan"><strong>${esc(p.goal)}</strong><div class="meta">关键词：${p.keywords.map(esc).join(' · ') || '—'} · 时间窗：${p.horizon_hours}h</div></div>`;
    resultEl.innerHTML = plan + group('需要注意', data.items.filter(x=>x.disposition==='attention')) + group('继续观察', data.items.filter(x=>x.disposition==='watch')) + group('背景', data.items.filter(x=>x.disposition==='background')) + (Object.keys(data.source_errors).length ? `<details><summary>源错误</summary><pre>${esc(JSON.stringify(data.source_errors,null,2))}</pre></details>` : '');
  } catch (err) {
    statusEl.textContent = '运行失败'; resultEl.innerHTML = `<pre>${esc(String(err))}</pre>`;
  }
});
</script>
</body>
</html>
